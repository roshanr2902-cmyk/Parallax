    const _IconSource = window.LucideReact || {};
    const _FallbackIcon = (props) => React.createElement(
      "svg",
      {
        width: props.size || 20,
        height: props.size || 20,
        viewBox: "0 0 24 24",
        fill: "none",
        stroke: "currentColor",
        strokeWidth: 2,
        strokeLinecap: "round",
        strokeLinejoin: "round",
        className: props.className,
        style: props.style
      },
      React.createElement("circle", { cx: 12, cy: 12, r: 9 })
    );
    window.LucideReact = new Proxy(_IconSource, {
      get(target, prop) {
        return target[prop] || _FallbackIcon;
      }
    });

    // Standalone replacement for the app's window.storage calls.
    if (!window.storage) {
      window.storage = {
        get: async (key) => {
          const value = localStorage.getItem(key);
          return value === null ? null : { value };
        },
        set: async (key, value) => {
          localStorage.setItem(key, value);
          return { value };
        }
      };
    }

// seeded pseudo-random so each stock/session is stable but distinct
function seededRandom(seed) {
  let s = seed;
  return () => {
    s = (s * 9301 + 49297) % 233280;
    return s / 233280;
  };
}

function buildPriceSeries(basePrice, seed, points) {
  const rand = seededRandom(seed);
  let price = basePrice * 0.94;
  const out = [];
  for (let i = 0; i < points; i++) {
    price = price + (rand() - 0.47) * basePrice * 0.012;
    out.push(Math.max(price, basePrice * 0.7));
  }
  out[out.length - 1] = basePrice;
  return out;
}

function makeAnalysis(stock, seedOffset) {
  const rand = seededRandom(stock.symbol.charCodeAt(0) * 13 + seedOffset);
  const pick = (arr) => arr[Math.floor(rand() * arr.length)];

  const technicalSignal = pick(["bullish", "bullish", "neutral"]);
  const fundamentalSignal = pick(["neutral", "bullish", "neutral"]);
  const sentimentSignal = pick(["positive", "positive", "neutral", "negative"]);

  const technical = {
    signal: technicalSignal,
    confidence: 70 + Math.floor(rand() * 20),
    metrics: [
      { label: "Momentum", value: 55 + Math.floor(rand() * 35) },
      { label: "Moving Average", value: 50 + Math.floor(rand() * 40) },
      { label: "Volume Trend", value: 45 + Math.floor(rand() * 45) },
      { label: "RSI (14)", value: 40 + Math.floor(rand() * 40) },
    ],
  };

  const fundamental = {
    signal: fundamentalSignal,
    confidence: 62 + Math.floor(rand() * 22),
    metrics: [
      { label: "Revenue Growth", value: 45 + Math.floor(rand() * 40) },
      { label: "Profit Growth", value: 40 + Math.floor(rand() * 45) },
      { label: "P/E vs Sector", value: 35 + Math.floor(rand() * 50) },
      { label: "Debt Position", value: 50 + Math.floor(rand() * 40) },
      { label: "ROE", value: 55 + Math.floor(rand() * 35) },
    ],
  };

  const posPct = sentimentSignal === "positive" ? 55 + Math.floor(rand() * 20)
    : sentimentSignal === "negative" ? 15 + Math.floor(rand() * 15)
    : 30 + Math.floor(rand() * 15);
  const negPct = sentimentSignal === "negative" ? 45 + Math.floor(rand() * 20)
    : sentimentSignal === "positive" ? 10 + Math.floor(rand() * 10)
    : 20 + Math.floor(rand() * 10);
  const neuPct = Math.max(10, 100 - posPct - negPct);

  const sentiment = {
    signal: sentimentSignal,
    confidence: 65 + Math.floor(rand() * 25),
    breakdown: { positive: posPct, neutral: neuPct, negative: negPct },
  };

  const signals = [technicalSignal, fundamentalSignal === "bullish" ? "bullish" : fundamentalSignal, sentimentSignal === "positive" ? "bullish" : sentimentSignal === "negative" ? "bearish" : "neutral"];
  const bullCount = signals.filter((s) => s === "bullish").length;
  const bearCount = signals.filter((s) => s === "bearish").length;
  const consensus = bullCount >= 2 ? "bullish" : bearCount >= 2 ? "bearish" : "neutral";
  const hasConflict = new Set(signals).size > 1 && !(bullCount >= 2 || bearCount >= 2);

  const overallConfidence = Math.round((technical.confidence + fundamental.confidence + sentiment.confidence) / 3);
  const riskLevel = pick(["Low", "Moderate", "Moderate", "Elevated"]);

  const outlookMap = {
    bullish: `Technical momentum on ${stock.symbol} remains constructive while fundamentals hold stable footing. Sentiment is broadly supportive, though valuation and short-term volatility keep risk at a ${riskLevel.toLowerCase()} setting.`,
    bearish: `${stock.symbol} is showing weakening technical structure alongside cautious sentiment. Fundamentals offer some support, but near-term pressure suggests a defensive stance is warranted.`,
    neutral: `Signals on ${stock.symbol} are mixed — technical and fundamental readings are roughly balanced while sentiment sits near the middle. A wait-and-watch approach fits the current picture.`,
  };

  const synthesis = {
    signal: consensus,
    confidence: overallConfidence,
    risk: riskLevel,
    outlook: outlookMap[consensus],
  };

  const conflictExplain = hasConflict
    ? `Technical positioning (${technicalSignal}) is not fully aligned with sentiment (${sentimentSignal}), which tempers overall conviction.`
    : null;

  const sources = [
    { title: `${stock.name} Q1 Earnings Call Recap`, type: "Fundamental", date: "Aug 28, 2026", snippet: "Management reiterated full-year guidance and flagged steady order-book growth across core segments.", link: "https://www.reuters.com" },
    { title: `Reuters — Market Sentiment Improves on Rate Outlook`, type: "Market News", date: "Aug 31, 2026", snippet: "Broader indices firmed as investors priced in a more stable rate trajectory heading into the new quarter.", link: "https://www.reuters.com" },
    { title: `Analyst Note: ${stock.symbol} Technical Breakout Watch`, type: "Technical", date: "Aug 30, 2026", snippet: "Price action has cleared a short-term resistance band on above-average volume, per desk commentary.", link: "https://www.bloomberg.com" },
    { title: `Sector Sentiment Tracker — Weekly Digest`, type: "Sentiment", date: "Aug 29, 2026", snippet: "Social and news sentiment for the sector edged higher week-over-week, led by improved analyst commentary.", link: "https://www.moneycontrol.com" },
  ];

  return { technical, fundamental, sentiment, synthesis, hasConflict, conflictExplain, signals, sources };
}

function signalMeta(signal) {
  switch (signal) {
    case "bullish":
    case "positive":
      return { label: signal === "positive" ? "POSITIVE" : "BULLISH", color: T.teal, bg: T.tealSoft, Icon: TrendingUp };
    case "bearish":
    case "negative":
      return { label: signal === "negative" ? "NEGATIVE" : "BEARISH", color: T.rose, bg: T.roseSoft, Icon: TrendingDown };
    default:
      return { label: "NEUTRAL", color: T.amber, bg: T.amberSoft, Icon: Minus };
  }
}

function useCountUp(target, duration = 900, decimals = 0, active = true) {
  const [val, setVal] = useState(0);
  const startRef = useRef(null);
  useEffect(() => {
    if (!active) return;
    startRef.current = null;
    let raf;
    const step = (ts) => {
      if (startRef.current === null) startRef.current = ts;
      const progress = Math.min(1, (ts - startRef.current) / duration);
      const eased = 1 - Math.pow(1 - progress, 3);
      setVal(target * eased);
      if (progress < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target, duration, active]);
  return val.toFixed(decimals);
}

function ConfidenceRing({ value, size = 64, stroke = 6, color }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const offset = c - (value / 100) * c;
  return (
    <div style={{ width: size, height: size }} className="relative shrink-0">
      <svg width={size} height={size} className="-rotate-90">
        <circle cx={size / 2} cy={size / 2} r={r} stroke="rgba(255,255,255,0.08)" strokeWidth={stroke} fill="none" />
        <circle
          cx={size / 2} cy={size / 2} r={r} stroke={color} strokeWidth={stroke} fill="none"
          strokeDasharray={c} strokeDashoffset={offset} strokeLinecap="round"
          style={{ transition: "stroke-dashoffset 1s cubic-bezier(.4,0,.2,1)" }}
        />
      </svg>
      <div className="absolute inset-0 flex items-center justify-center text-sm font-semibold" style={{ color: T.text, fontFamily: "'Space Grotesk', sans-serif" }}>
        {Math.round(value)}%
      </div>
    </div>
  );
}

          boxShadow: isActive ? `0 0 24px -4px ${T.violet}88` : isDone ? `0 0 18px -6px ${T.teal}66` : "none",
        }}
      >
        {isActive ? <Loader2 size={20} color={color} className="animate-spin" /> : <step.Icon size={20} color={color} />}
        {isDone && (
          <div className="absolute -right-1 -top-1 flex h-4 w-4 items-center justify-center rounded-full" style={{ background: T.teal }}>
            <CheckCircle2 size={12} color="#0A0D16" />

        )}

      <div className="text-center">
        <div className="text-xs font-medium" style={{ color: isActive || isDone ? T.text : T.textMuted }}>{step.label}</div>

    </div>
  );
}

function AgentPipeline({ statuses, analysis }) {
  const resultFor = (key) => (key === "technical" ? analysis?.technical : key === "fundamental" ? analysis?.fundamental : key === "sentiment" ? analysis?.sentiment : key === "synthesis" ? analysis?.synthesis : null);

    <GlassCard className="p-5 sm:p-6">

      <div className="flex items-center gap-1 overflow-x-auto pb-2 sm:justify-between sm:gap-0">

const INITIAL_STATUSES = { market: "waiting", technical: "waiting", fundamental: "waiting", sentiment: "waiting", risk: "waiting", synthesis: "waiting" };

function DashboardPage({ stock, setStock, riskProfile, history, pushHistory }) {
  const [phase, setPhase] = useState("idle"); // idle | running | done | error
  const [statuses, setStatuses] = useState(INITIAL_STATUSES);
  const [analysis, setAnalysis] = useState(null);
  const timers = useRef([]);

  const clearTimers = () => { timers.current.forEach(clearTimeout); timers.current = []; };
  useEffect(() => () => clearTimers(), []);

  const runAnalysis = useCallback(() => {
    clearTimers();
    setPhase("running");
    setAnalysis(null);
    setStatuses(INITIAL_STATUSES);

    const order = ["market", "technical", "fundamental", "sentiment", "risk", "synthesis"];
    const stepDelay = 550;
    order.forEach((key, idx) => {
      timers.current.push(setTimeout(() => {
        setStatuses((prev) => ({ ...prev, [key]: "analyzing" }));
      }, idx * stepDelay));
      timers.current.push(setTimeout(() => {
        setStatuses((prev) => ({ ...prev, [key]: "complete" }));
      }, idx * stepDelay + stepDelay - 120));
    });

    timers.current.push(setTimeout(() => {
      const result = makeAnalysis(stock, Date.now() % 97);
      setAnalysis(result);
      setPhase("done");
      pushHistory({
        id: `h-${Date.now()}`,
        symbol: stock.symbol,
        date: new Date().toLocaleString("en-IN", { day: "2-digit", month: "short", year: "numeric", hour: "numeric", minute: "2-digit" }),
        signal: result.synthesis.signal,
        confidence: result.synthesis.confidence,
        risk: result.synthesis.risk,
      });
    }, order.length * stepDelay + 200));
  }, [stock, pushHistory]);

  const sparkline = useMemo(() => buildPriceSeries(stock.price, stock.symbol.length + 3, 20).map((v) => Number(v.toFixed(1))), [stock]);

  return (
    <div className="flex flex-col gap-6">
      {/* Hero */}
      <GlassCard glow className="relative overflow-hidden p-6 sm:p-9" style={{ background: `radial-gradient(1200px 400px at 10% -10%, ${T.violetSoft}, transparent), ${T.panel}` }}>
        <div className="relative">
          <span className="mb-3 inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-xs" style={{ background: T.tealSoft, color: T.teal }}>
            <span className="h-1.5 w-1.5 animate-pulse rounded-full" style={{ background: T.teal }} />
            Demo Mode Active
          </span>
          <h1 style={{ fontFamily: "'Space Grotesk', sans-serif", color: T.text }} className="max-w-xl text-2xl font-semibold leading-tight sm:text-3xl">
            AI-Powered Market Intelligence
          </h1>
          <p className="mt-2 max-w-lg text-sm" style={{ color: T.textMuted }}>
            Analyze market signals using multiple specialized AI agents — for decision-support and education, not trade execution.
          </p>

          <div className="mt-6 flex flex-col gap-3 sm:flex-row sm:items-center">
            <StockSelector stock={stock} setStock={setStock} />
            <span className="hidden text-xs sm:inline" style={{ color: T.textFaint }}>Risk profile: <span style={{ color: T.cyan }}>{riskProfile}</span></span>
          </div>

          <button
            onClick={runAnalysis}
            disabled={phase === "running"}
            className="mt-6 inline-flex items-center gap-2 rounded-xl px-6 py-3 text-sm font-semibold transition-transform active:scale-[0.98] disabled:opacity-60"
            style={{
              background: `linear-gradient(135deg, ${T.violet}, ${T.cyan})`,
              color: "#0A0D16",
              boxShadow: `0 0 32px -6px ${T.violet}aa`,
            }}
          >
            {phase === "running" ? <Loader2 size={16} className="animate-spin" /> : <Zap size={16} fill="#0A0D16" />}
            {phase === "running" ? "Analyzing…" : "Analyze Stock"}
          </button>
        </div>
      </GlassCard>

      {phase === "idle" && !analysis && (
        <GlassCard className="p-6 text-center text-sm" style={{ color: T.textFaint }}>
          No analysis available yet. Select a stock and click Analyze.
        </GlassCard>
      )}

      {phase !== "idle" && <AgentPipeline statuses={statuses} analysis={analysis} />}

      {phase !== "idle" && (
        <div className="grid grid-cols-1 gap-4 lg:grid-cols-3">
          <TechnicalCard data={analysis?.technical} sparkline={sparkline} />
          <FundamentalCard data={analysis?.fundamental} />
          <SentimentCard data={analysis?.sentiment} />
        </div>
      )}

      {analysis && (
        <>
          <div className="grid grid-cols-1 gap-4 lg:grid-cols-5">
            <div className="lg:col-span-3"><SynthesisCard analysis={analysis} stock={stock} /></div>
            <div className="lg:col-span-2"><ConflictDetector analysis={analysis} /></div>
          </div>
          <RiskAdjustedInsight riskProfile={riskProfile} analysis={analysis} />
        </>
      )}

      <div>
        <SectionHeading icon={BarChart3} title="Market Metrics" subtitle={`Live snapshot for ${stock.symbol}`} />
        <MarketMetrics stock={stock} analysis={analysis} active={phase !== "idle" || true} />
      </div>

      <PriceChart stock={stock} />

      {analysis && <SourcesSection sources={analysis.sources} />}

      <PerformanceSection />
    </div>
  );
}

/* ----------------------------------------------------------------------- */
/*  PORTFOLIO PAGE                                                         */
/* ----------------------------------------------------------------------- */
function PortfolioPage() {
  const rows = PORTFOLIO_HOLDINGS.filter((h) => !h.isOther).map((h) => {
    const pl = (h.ltp - h.avg) * h.qty;
    const plPct = ((h.ltp - h.avg) / h.avg) * 100;
    return { ...h, pl, plPct, value: h.ltp * h.qty };
  });
  const totalValue = rows.reduce((s, r) => s + r.value, 0) + PORTFOLIO_HOLDINGS.find((h) => h.isOther).value;
  const totalPL = rows.reduce((s, r) => s + r.pl, 0);
  const totalCost = rows.reduce((s, r) => s + r.avg * r.qty, 0);
  const totalPLPct = (totalPL / totalCost) * 100;

  return (
    <div className="flex flex-col gap-6">
      <SectionHeading icon={Wallet} title="Portfolio Overview" subtitle="Illustrative holdings for demo purposes" />
      <div className="grid grid-cols-2 gap-3 sm:grid-cols-4">
        <GlassCard className="p-4">
          <div className="text-[11px]" style={{ color: T.textMuted }}>Total Value</div>
          <div className="mt-1 text-lg font-semibold sm:text-xl" style={{ fontFamily: "'Space Grotesk', sans-serif", color: T.text }}>₹{totalValue.toLocaleString()}</div>
        </GlassCard>
        <GlassCard className="p-4">
          <div className="text-[11px]" style={{ color: T.textMuted }}>Today's Change</div>
          <div className="mt-1 flex items-center gap-1 text-lg font-semibold sm:text-xl" style={{ fontFamily: "'Space Grotesk', sans-serif", color: T.teal }}>
            <ArrowUpRight size={16} /> +1.42%
          </div>
        </GlassCard>
        <GlassCard className="p-4">
          <div className="text-[11px]" style={{ color: T.textMuted }}>Overall P/L</div>
          <div className="mt-1 text-lg font-semibold sm:text-xl" style={{ fontFamily: "'Space Grotesk', sans-serif", color: totalPL >= 0 ? T.teal : T.rose }}>
            {totalPL >= 0 ? "+" : ""}₹{Math.round(totalPL).toLocaleString()} <span className="text-xs" style={{ color: T.textMuted }}>({totalPLPct.toFixed(1)}%)</span>
          </div>
        </GlassCard>
        <GlassCard className="p-4">
          <div className="text-[11px]" style={{ color: T.textMuted }}>Portfolio Risk</div>
          <div className="mt-1 text-lg font-semibold sm:text-xl" style={{ fontFamily: "'Space Grotesk', sans-serif", color: T.amber }}>Moderate</div>
        </GlassCard>
      </div>

      <div className="grid grid-cols-1 gap-4 lg:grid-cols-5">
        <GlassCard className="overflow-hidden lg:col-span-3">
          <div className="p-5 pb-0"><SectionHeading title="Holdings" subtitle="Current positions" /></div>
          <div className="overflow-x-auto px-5 pb-5">
            <table className="w-full min-w-[480px] text-sm">
              <thead>
                <tr style={{ color: T.textFaint }} className="text-left text-xs">
                  <th className="pb-2 font-medium">Stock</th>
                  <th className="pb-2 font-medium">Qty</th>
                  <th className="pb-2 font-medium">Avg Price</th>
                  <th className="pb-2 font-medium">Current</th>
                  <th className="pb-2 text-right font-medium">P/L</th>
                </tr>
              </thead>
              <tbody>
                {rows.map((r) => (
                  <tr key={r.symbol} style={{ borderTop: `1px solid ${T.panelBorder}` }}>
                    <td className="py-2.5 font-medium" style={{ color: T.text }}>{r.symbol}</td>
                    <td className="py-2.5" style={{ color: T.textMuted }}>{r.qty}</td>
                    <td className="py-2.5" style={{ color: T.textMuted, fontVariantNumeric: "tabular-nums" }}>₹{r.avg.toLocaleString()}</td>
                    <td className="py-2.5" style={{ color: T.text, fontVariantNumeric: "tabular-nums" }}>₹{r.ltp.toLocaleString()}</td>
                    <td className="py-2.5 text-right font-medium" style={{ color: r.pl >= 0 ? T.teal : T.rose, fontVariantNumeric: "tabular-nums" }}>
                      {r.pl >= 0 ? "+" : ""}₹{Math.round(r.pl).toLocaleString()}
                      <span className="ml-1 text-xs" style={{ color: T.textFaint }}>({r.plPct.toFixed(1)}%)</span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </GlassCard>

        <GlassCard className="p-5 lg:col-span-2">
          <SectionHeading title="Allocation" subtitle="By position size" />
          <div style={{ width: "100%", height: 200 }}>
            <ResponsiveContainer>
              <PieChart>
                <Pie data={ALLOCATION} dataKey="value" nameKey="name" innerRadius={55} outerRadius={82} paddingAngle={3}>
                  {ALLOCATION.map((a) => <Cell key={a.name} fill={a.color} stroke="none" />)}
                </Pie>
                <Tooltip contentStyle={{ background: "#12162A", border: `1px solid ${T.panelBorderStrong}`, borderRadius: 10, fontSize: 12 }} itemStyle={{ color: T.text }} />
              </PieChart>
            </ResponsiveContainer>
          </div>
          <div className="mt-2 flex flex-col gap-1.5">
            {ALLOCATION.map((a) => (
              <div key={a.name} className="flex items-center justify-between text-xs">
                <span className="flex items-center gap-1.5" style={{ color: T.textMuted }}>
                  <span className="h-2 w-2 rounded-full" style={{ background: a.color }} /> {a.name}
                </span>
                <span style={{ color: T.text }}>{a.value}%</span>
              </div>
            ))}
          </div>
        </GlassCard>
      </div>
    </div>
  );
}

              <div className="flex justify-between"><span style={{ color: T.textMuted }}>Signal</span><SignalBadge signal={selected.signal} size="sm" /></div>
              <div className="flex justify-between"><span style={{ color: T.textMuted }}>Confidence</span><span style={{ color: T.text }}>{selected.confidence}%</span></div>
              <div className="flex justify-between"><span style={{ color: T.textMuted }}>Risk</span><span style={{ color: T.text }}>{selected.risk}</span></div>

/* ----------------------------------------------------------------------- */
/*  ROOT APP                                                                */
/* ----------------------------------------------------------------------- */
function App() {
  const [page, setPage] = useState("dashboard");
  const [stock, setStock] = useState(STOCKS[0]);
  const [riskProfile, setRiskProfile] = useState("Moderate");
  const [history, setHistory] = useState(SEED_HISTORY);
  const [historyLoading, setHistoryLoading] = useState(true);

  // load persisted history (falls back silently to seed data if storage is unavailable)
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const res = await window.storage?.get?.("finvest:history", false);
        if (!cancelled && res?.value) {
          const parsed = JSON.parse(res.value);
          if (Array.isArray(parsed) && parsed.length) setHistory(parsed);
        }
      } catch (e) {
        // no saved history yet — keep seed data
      } finally {
        if (!cancelled) setHistoryLoading(false);
      }
    })();
    return () => { cancelled = true; };
  }, []);

  const pushHistory = useCallback((entry) => {
    setHistory((prev) => {
      const next = [entry, ...prev].slice(0, 20);
      (async () => {
        try { await window.storage?.set?.("finvest:history", JSON.stringify(next), false); } catch (e) { /* ignore */ }
      })();
      return next;
    });
  }, []);

  return (
    <div style={{ background: T.bg, minHeight: "100vh", fontFamily: "'Inter', sans-serif" }}>
      <style>{FONTS}{`
        * { box-sizing: border-box; }
        ::selection { background: ${T.violet}55; }
        body { -webkit-font-smoothing: antialiased; }
        table { border-collapse: collapse; }
        @media (prefers-reduced-motion: reduce) {
          *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
        button:focus-visible, a:focus-visible, input:focus-visible {
          outline: 2px solid ${T.cyan};
          outline-offset: 2px;
        }
        ::-webkit-scrollbar { height: 8px; width: 8px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 8px; }
      `}</style>

      <Navbar page={page} setPage={setPage} riskProfile={riskProfile} setRiskProfile={setRiskProfile} />

      <main className="mx-auto max-w-7xl px-4 py-6 sm:px-6 sm:py-8">
        {page === "dashboard" && (
          <DashboardPage stock={stock} setStock={setStock} riskProfile={riskProfile} history={history} pushHistory={pushHistory} />
        )}
        {page === "portfolio" && <PortfolioPage />}
        {page === "history" && <HistoryPage history={history} loading={historyLoading} />}
        {page === "about" && <AboutPage />}
      </main>

      <footer className="mx-auto max-w-7xl px-4 pb-8 pt-4 text-center text-xs sm:px-6" style={{ color: T.textFaint }}>
        FINVEST AI is a decision-support and educational analysis tool — not a platform for executing trades.
      </footer>
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
